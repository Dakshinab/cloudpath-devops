<svg width="900" height="1180" viewBox="0 0 900 1180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="1180" fill="#fafafa"/>

  <text x="450" y="45" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b">CloudPath — System Architecture</text>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Source-to-service DevOps pipeline — local Kubernetes (kind), zero cloud cost</text>

  <!-- LAYER 1: Source Control -->
  <rect x="60" y="100" width="780" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">LAYER 1 — SOURCE CONTROL</text>

  <!-- GitHub icon -->
  <g transform="translate(85,135)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#1e293b"/>
    <circle cx="24" cy="18" r="8" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <circle cx="14" cy="34" r="5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <circle cx="34" cy="34" r="5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M24 26 L24 30 M20 30 L14 30 L14 29 M28 30 L34 30 L34 29" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <text x="150" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e293b">GitHub Repository</text>
  <text x="150" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Developer pushes code to the main branch — the single source of truth</text>

  <line x1="450" y1="190" x2="450" y2="215" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- LAYER 2: CI/CD -->
  <rect x="60" y="220" width="780" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">LAYER 2 — CONTINUOUS INTEGRATION</text>

  <!-- GitHub Actions gear icon -->
  <g transform="translate(85,255)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#2563eb"/>
    <circle cx="24" cy="24" r="9" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <circle cx="24" cy="24" r="3" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
      <line x1="24" y1="9" x2="24" y2="13"/>
      <line x1="24" y1="35" x2="24" y2="39"/>
      <line x1="9" y1="24" x2="13" y2="24"/>
      <line x1="35" y1="24" x2="39" y2="24"/>
      <line x1="13.9" y1="13.9" x2="16.7" y2="16.7"/>
      <line x1="31.3" y1="31.3" x2="34.1" y2="34.1"/>
      <line x1="34.1" y1="13.9" x2="31.3" y2="16.7"/>
      <line x1="16.7" y1="31.3" x2="13.9" y2="34.1"/>
    </g>
  </g>
  <text x="150" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e293b">GitHub Actions</text>
  <text x="150" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Runs on every push: unit test → build jar → build image → Trivy scan</text>

  <line x1="450" y1="310" x2="450" y2="335" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- LAYER 3: Container -->
  <rect x="60" y="340" width="780" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">LAYER 3 — CONTAINERIZATION</text>

  <!-- Docker whale icon -->
  <g transform="translate(85,375)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#0db7ed"/>
    <path d="M8 30 Q8 24 14 24 L34 24 Q38 24 38 28 Q38 34 30 34 L14 34 Q8 34 8 30 Z" fill="#ffffff"/>
    <rect x="14" y="18" width="5" height="5" fill="#ffffff"/>
    <rect x="20" y="18" width="5" height="5" fill="#ffffff"/>
    <rect x="26" y="18" width="5" height="5" fill="#ffffff"/>
    <rect x="20" y="12" width="5" height="5" fill="#ffffff"/>
  </g>
  <text x="150" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Docker Image</text>
  <text x="150" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Spring Boot app packaged as a sealed image; runs as non-root user (appuser)</text>

  <line x1="450" y1="430" x2="450" y2="455" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- LAYER 4: Orchestration -->
  <rect x="60" y="460" width="780" height="290" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">LAYER 4 — ORCHESTRATION (KUBERNETES / kind)</text>

  <!-- Kubernetes wheel icon -->
  <g transform="translate(85,495)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#326ce5"/>
    <polygon points="24,9 33,15 33,27 24,33 15,27 15,15" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="24" cy="21" r="4" fill="#ffffff"/>
  </g>
  <text x="150" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Kubernetes Cluster — namespace: cloudpath</text>
  <text x="150" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Manages the running app: restarts on failure, exposes it, injects config</text>

  <!-- k8s object boxes inside namespace -->
  <rect x="90" y="555" width="330" height="170" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="105" y="573" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#4338ca">NAMESPACE: cloudpath</text>

  <rect x="105" y="583" width="145" height="55" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="177" y="602" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">ConfigMap</text>
  <text x="177" y="618" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">APP_MESSAGE</text>

  <rect x="260" y="583" width="145" height="55" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="332" y="602" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Secret</text>
  <text x="332" y="618" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">demo value</text>

  <rect x="105" y="648" width="300" height="60" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="255" y="668" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Deployment → Pod</text>
  <text x="255" y="686" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">runs cloudpath-app container, port 8080</text>

  <line x1="177" y1="638" x2="200" y2="648" stroke="#a5b4fc" stroke-width="1.5"/>
  <line x1="332" y1="638" x2="310" y2="648" stroke="#a5b4fc" stroke-width="1.5"/>

  <!-- Service box outside dashed group -->
  <rect x="460" y="583" width="330" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="625" y="605" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#065f46">Service (NodePort)</text>
  <text x="625" y="623" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#047857">exposes the pod — reached via kubectl port-forward</text>

  <line x1="405" y1="678" x2="460" y2="613" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- rollout note -->
  <rect x="460" y="663" width="330" height="65" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3"/>
  <text x="625" y="683" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#9a3412">Rollout / Rollback</text>
  <text x="625" y="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c2410c">kubectl rollout restart / undo</text>
  <text x="625" y="715" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c2410c">(ConfigMap changes need manual reapply)</text>

  <line x1="450" y1="750" x2="450" y2="775" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- LAYER 5: Infrastructure as Code -->
  <rect x="60" y="780" width="780" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">LAYER 5 — INFRASTRUCTURE AS CODE</text>

  <!-- Terraform icon -->
  <g transform="translate(85,815)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#7b42bc"/>
    <polygon points="10,10 20,15 20,25 10,20" fill="#ffffff"/>
    <polygon points="22,15 32,20 32,30 22,25" fill="#ffffff"/>
    <polygon points="10,22 20,27 20,37 10,32" fill="#ffffff"/>
  </g>
  <text x="150" y="832" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Terraform</text>
  <text x="150" y="852" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Docker provider — describes infra as code (init, fmt, validate, plan)</text>

  <line x1="450" y1="870" x2="450" y2="895" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- LAYER 6: Monitoring -->
  <rect x="60" y="900" width="780" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="922" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">LAYER 6 — MONITORING &amp; OBSERVABILITY</text>

  <!-- Monitoring icon -->
  <g transform="translate(85,935)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#e6522c"/>
    <polyline points="8,32 17,22 24,27 40,12" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="12" r="3" fill="#ffffff"/>
    <line x1="8" y1="36" x2="40" y2="36" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="150" y="952" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e293b">kubectl-based Monitoring</text>
  <text x="150" y="972" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Pod status, resource usage (metrics-server), logs, /actuator/health checks</text>

  <!-- Legend footer -->
  <line x1="60" y1="1005" x2="840" y2="1005" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="1030" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">Every layer's evidence (scan results, plans, logs, notes) is captured under /docs in the repository.</text>
  <text x="60" y="1050" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">No paid cloud resources are used — Kubernetes runs locally via kind; Terraform manages local Docker resources.</text>

</svg>
